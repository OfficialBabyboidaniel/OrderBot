version: '3.8'

services:
  discord-bot:
    build: .
    container_name: ordering-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - NODE_ENV=production
      - BACKEND_API_URL=http://order-backend:3000
    volumes:
      # Optional: Mount logs directory
      - ./logs:/app/logs
    # Optional: Health check
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  default:
    external: true
    name: order_management_system_order-network
